<style>
  #loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #4f46e5;
    background: #ffffff;
    /* Delayed spinner (delay + minDuration pattern, per UX research). Stay
       invisible for 500ms, then fade in. Fast loads (hard reload ~70ms, quick
       first visits) reveal content before this fires, so the spinner never
       flashes; only a genuinely slow load shows it. The 500ms here must match
       SPINNER_DELAY in index.js, which also holds a shown spinner ~200ms to
       prevent flicker. */
    opacity: 0;
    animation: loading-appear 150ms ease-out 500ms forwards;
  }
  @keyframes loading-appear {
    to { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loading { animation-duration: 1ms; }
  }
  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    font-weight: 500;
    font-size: 1.1rem;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: #4f46e5;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
